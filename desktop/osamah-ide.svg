<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E8CFF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Orbit Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="85" fill="none" stroke="#5E8CFF" stroke-width="6" stroke-dasharray="14 10" transform="rotate(-30 256 256)" opacity="0.65" />

  <!-- Middle Orbit Ring -->
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="url(#orbitGrad)" stroke-width="8" transform="rotate(25 256 256)" filter="url(#glow)" />

  <!-- Inner Orbit Ring -->
  <ellipse cx="256" cy="256" rx="100" ry="45" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8 6" transform="rotate(-75 256 256)" opacity="0.8" />

  <!-- Central Nucleus -->
  <circle cx="256" cy="256" r="32" fill="#5E8CFF" filter="url(#glow)" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" />

  <!-- Orbit Nodes -->
  <circle cx="360" cy="180" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="150" cy="330" r="8" fill="#5E8CFF" />
  <circle cx="330" cy="350" r="7" fill="#60a5fa" />
</svg>
