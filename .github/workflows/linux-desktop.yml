name: Linux desktop build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Ubuntu packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify Linux desktop packages
        run: pnpm desktop:build
        env:
          CI: true

      - name: Upload AppImage and Debian package
        uses: actions/upload-artifact@v6
        with:
          name: osamah-ide-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
