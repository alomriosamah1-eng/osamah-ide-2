name: Build Ubuntu Linux Desktop Packages

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-desktop:
    name: Build .deb & .tar.gz for Ubuntu Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Install Python dependencies for Presenton Bridge
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn

      - name: Verify Types and Test Suite
        run: |
          pnpm run check
          pnpm run test

      - name: Build Production Assets
        run: pnpm run build

      - name: Package Linux Desktop Application (.deb & .tar.gz)
        run: bash scripts/package-linux-desktop.sh

      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osamah-ide-ubuntu-linux-x64
          path: |
            release/*.deb
            release/*.tar.gz
          retention-days: 14

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*.deb
            release/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
